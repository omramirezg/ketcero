const DEFS = "<defs><marker id=\"punta\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"9\" markerHeight=\"9\" orient=\"auto\"><path d=\"M0,1 L10,5 L0,9\" fill=\"none\" stroke=\"#1A1A1A\" stroke-width=\"1.5\"/></marker><marker id=\"puntar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"9\" markerHeight=\"9\" orient=\"auto\"><path d=\"M0,1 L10,5 L0,9\" fill=\"none\" stroke=\"#B0302A\" stroke-width=\"1.5\"/></marker><marker id=\"puntag\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"9\" markerHeight=\"9\" orient=\"auto\"><path d=\"M0,1 L10,5 L0,9\" fill=\"none\" stroke=\"#6B6B6B\" stroke-width=\"1.5\"/></marker></defs>";
const SECC = [];
let actual = 0;
function pintar(n, animar){
  actual = Math.max(0, Math.min(PASOS.length-1, n));
  const p = PASOS[actual];
  document.body.classList.toggle("animar", !!animar);
  document.getElementById("dibujo").innerHTML = DEFS + p.svg;
  const tx = document.getElementById("texto");
  tx.style.fontSize = ""; tx.innerHTML = "<div>" + p.cap + "</div>";
  for (const f of [24, 22, 20]) { if (tx.firstChild.offsetHeight <= tx.clientHeight) break; tx.style.fontSize = f + "px"; }
  document.getElementById("notas").innerHTML = (p.nota || []).map(n =>
    `<div class="nota" style="left:${n.x}px;top:${n.y}px;width:${n.w}px">${n.q ? '<span class="q">' + n.q + '</span>' : ''}${n.txt}</div>`).join("");
  const cab = document.getElementById("cabeza");
  if (SECC.length) {
    cab.innerHTML = SECC.map((s,i)=>`<span class="sec ${i===p.sec?'act':''}">${s}</span>`).join('<span class="pt">·</span>');
  } else { cab.innerHTML = `<span class="tit">A1 · La ventana de 3 × 3 sobre el 5</span>`; }
  document.getElementById("cont").textContent = `${actual+1} / ${PASOS.length}`;
  document.getElementById("ant").disabled = actual===0;
  document.getElementById("sig").disabled = actual===PASOS.length-1;
  const h = "#"+(actual+1); if(location.hash!==h) history.replaceState(null,"",h);
}
function escalar(){
  const m=document.getElementById("marco"), e=Math.min(innerWidth/1600, innerHeight/900);
  m.style.transform=`scale(${e})`; m.style.left=((innerWidth-1600*e)/2)+"px"; m.style.top=((innerHeight-900*e)/2)+"px";
}
function irHash(){ const n=parseInt((location.hash||"#1").slice(1)); if(!isNaN(n) && n-1!==actual) pintar(n-1,false); }
document.getElementById("ant").onclick=()=>pintar(actual-1,false);
document.getElementById("sig").onclick=()=>pintar(actual+1,true);
addEventListener("keydown",ev=>{
  if(["ArrowRight","ArrowDown","PageDown"," ","Enter"].includes(ev.key)){ ev.preventDefault(); if(actual<PASOS.length-1) pintar(actual+1,true); }
  else if(["ArrowLeft","ArrowUp","PageUp","Backspace"].includes(ev.key)){ ev.preventDefault(); if(actual>0) pintar(actual-1,false); }
  else if(ev.key==="Home") pintar(0,false); else if(ev.key==="End") pintar(PASOS.length-1,false);
});
addEventListener("resize",escalar); addEventListener("hashchange",irHash);
escalar();
const n0=parseInt((location.hash||"#1").slice(1)); pintar(isNaN(n0)?0:n0-1,false);
</script>
